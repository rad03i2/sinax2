name: Build SINAX Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Upgrade packaging tools
        shell: pwsh
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify critical imports
        shell: pwsh
        run: |
          python -c "import PySide6, psutil; print('PySide6', PySide6.__version__); print('psutil', psutil.__version__)"
          python -m compileall -q main.py app

      - name: Build SINAX with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm --clean SINAX.spec

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist\SINAX\SINAX.exe')) { throw 'SINAX.exe was not produced' }
          Write-Host "Built executable: dist\SINAX\SINAX.exe"
          Get-Item 'dist\SINAX\SINAX.exe' | Format-List Name,Length,LastWriteTime

      - name: Create Windows x64 ZIP
        shell: pwsh
        run: |
          if (Test-Path 'SINAX-Windows-x64.zip') { Remove-Item 'SINAX-Windows-x64.zip' -Force }
          Compress-Archive -Path 'dist\SINAX\*' -DestinationPath 'SINAX-Windows-x64.zip' -CompressionLevel Optimal
          Get-Item 'SINAX-Windows-x64.zip' | Format-List Name,Length,LastWriteTime

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SINAX-Windows-x64
          path: |
            SINAX-Windows-x64.zip
            dist/SINAX/SINAX.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub Release assets for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SINAX-Windows-x64.zip
            dist/SINAX/SINAX.exe
          generate_release_notes: true
