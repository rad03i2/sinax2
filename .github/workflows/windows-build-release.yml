name: Build SINAX Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Upgrade packaging tools
        shell: pwsh
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify critical imports and update tooling
        shell: pwsh
        run: |
          python -c "import PySide6, psutil; print('PySide6', PySide6.__version__); print('psutil', psutil.__version__)"
          python -m compileall -q main.py app tools tests\test_incremental_update.py
          python -c "from app.core.constants import APP_VERSION; print('SINAX version', APP_VERSION)"

      - name: Test incremental updater
        shell: pwsh
        run: python -m unittest tests.test_incremental_update -v

      - name: Build SINAX with PyInstaller
        shell: pwsh
        run: pyinstaller --noconfirm --clean SINAX.spec

      - name: Build standalone SINAX updater
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SINAX-Updater tools\sinax_updater.py
          if (!(Test-Path 'dist\SINAX-Updater.exe')) { throw 'SINAX-Updater.exe was not produced' }
          Copy-Item 'dist\SINAX-Updater.exe' 'dist\SINAX\SINAX-Updater.exe' -Force

      - name: Verify build output
        shell: pwsh
        run: |
          if (!(Test-Path 'dist\SINAX\SINAX.exe')) { throw 'SINAX.exe was not produced' }
          if (!(Test-Path 'dist\SINAX\SINAX-Updater.exe')) { throw 'Updater was not copied into the app folder' }
          Write-Host "Built executable: dist\SINAX\SINAX.exe"
          Write-Host "Built updater:    dist\SINAX\SINAX-Updater.exe"
          Get-Item 'dist\SINAX\SINAX.exe','dist\SINAX\SINAX-Updater.exe' | Format-Table Name,Length,LastWriteTime

      - name: Create Windows x64 ZIP
        shell: pwsh
        run: |
          if (Test-Path 'SINAX-Windows-x64.zip') { Remove-Item 'SINAX-Windows-x64.zip' -Force }
          Compress-Archive -Path 'dist\SINAX\*' -DestinationPath 'SINAX-Windows-x64.zip' -CompressionLevel Optimal
          Get-Item 'SINAX-Windows-x64.zip' | Format-List Name,Length,LastWriteTime

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SINAX-Windows-x64
          path: |
            SINAX-Windows-x64.zip
            dist/SINAX/SINAX.exe
            dist/SINAX/SINAX-Updater.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Determine release version
        id: release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          $appVersion = (python -c "from app.core.constants import APP_VERSION; print(APP_VERSION)").Trim()
          $currentTag = "v$appVersion"
          if ('${{ github.ref }}'.StartsWith('refs/tags/v')) {
            $requestedTag = '${{ github.ref_name }}'
            if ($requestedTag.TrimStart('v') -ne $appVersion) {
              throw "Tag version $requestedTag does not match APP_VERSION $appVersion"
            }
          }
          "version=$appVersion" >> $env:GITHUB_OUTPUT
          "tag=$currentTag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $currentTag"

      - name: Prepare incremental update assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: patch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $currentVersion = '${{ steps.release.outputs.version }}'
          $currentTag = '${{ steps.release.outputs.tag }}'
          if (Test-Path 'update-manifest.json') { Remove-Item 'update-manifest.json' -Force }

          $releaseRows = gh release list --repo '${{ github.repository }}' --limit 50 --json tagName,isDraft,isPrerelease | ConvertFrom-Json
          $previousRows = @($releaseRows | Where-Object { -not $_.isDraft -and -not $_.isPrerelease -and $_.tagName -ne $currentTag } | Select-Object -First 2)

          if ($previousRows.Count -eq 0) {
            Write-Host 'No previous release exists. Creating baseline manifest without a patch.'
            python -c "import json; from app.core.constants import APP_VERSION; open('update-manifest.json','w',encoding='utf-8').write(json.dumps({'schema':1,'version':APP_VERSION,'patches':[]},ensure_ascii=False,indent=2))"
            "has_patch=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $generated = 0
          foreach ($previous in $previousRows) {
            $previousTag = $previous.tagName
            $previousVersion = $previousTag.TrimStart('v')
            $safe = $previousVersion.Replace('.', '-')
            $releaseDir = "previous-release-$safe"
            $buildDir = "previous-build-$safe"
            New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

            gh release download $previousTag --repo '${{ github.repository }}' --pattern 'SINAX-Windows-x64.zip' --dir $releaseDir
            if ($LASTEXITCODE -ne 0 -or !(Test-Path "$releaseDir\SINAX-Windows-x64.zip")) {
              Write-Warning "Skipping $previousTag because the full Windows ZIP is unavailable"
              continue
            }

            Expand-Archive -Path "$releaseDir\SINAX-Windows-x64.zip" -DestinationPath $buildDir -Force
            $patchName = "SINAX-Update-v$previousVersion-to-v$currentVersion.zip"
            python tools\make_update_patch.py `
              --previous $buildDir `
              --current dist\SINAX `
              --from-version $previousVersion `
              --to-version $currentVersion `
              --output $patchName `
              --manifest update-manifest.json

            if (!(Test-Path $patchName)) { throw "Incremental patch was not produced for $previousVersion" }
            $generated++
          }

          if (!(Test-Path 'update-manifest.json')) {
            python -c "import json; from app.core.constants import APP_VERSION; open('update-manifest.json','w',encoding='utf-8').write(json.dumps({'schema':1,'version':APP_VERSION,'patches':[]},ensure_ascii=False,indent=2))"
          }
          "has_patch=$($generated -gt 0)".ToLower() >> $env:GITHUB_OUTPUT
          Write-Host "Generated $generated incremental patch(es)."
          Get-Content 'update-manifest.json'

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            SINAX-Windows-x64.zip
            dist/SINAX/SINAX.exe
            dist/SINAX/SINAX-Updater.exe
            update-manifest.json
            SINAX-Update-*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
